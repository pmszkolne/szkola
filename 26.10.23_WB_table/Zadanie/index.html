<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <table>
        <caption>Super tabela</caption>
        <colgroup>
            <col span="3" style="background-color: aqua;">
            <col span="2" style="background-color:greenyellow;">
        </colgroup>

        <thead style="background-color: beige;">
            <tr>
                <th rowspan="2">L.p.</th>
                <th rowspan="2">Nazwisko</th>
                <th rowspan="2">Imie</th>
                <th colspan="2">Wpłata</th>
            </tr>
            <tr>
                <th>Rata I</th>
                <th>Rata II</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1.</td>
                <td>Białasik</td>
                <td>Wojciech</td>
                <td>100</td>
                <td>200</td>
            </tr>
            <tr>
                <td>2.</td>
                <td>Nadstawek</td>
                <td>Aleks</td>
                <td>50</td>
                <td>150</td>
            </tr>
            <tr>
                <td>3.</td>
                <td>Nadstawek</td>
                <td>Aleks</td>
                <td>150</td>
                <td>50</td>
            </tr>
            <tr>
                <td>4.</td>
                <td>Nadstawek</td>
                <td>Aleks</td>
                <td>100</td>
                <td>200</td>
            </tr>
        </tbody>
        <tfoot style="background-color:coral;">
            <tr>
                <th rowspan="2" colspan="2">Podsumowanie</th>
                <th>Rata</th>
                <th>400</th>
                <th>400</th>
            </tr>
            <tr>
                <th>Łącznie</th>
                <td colspan="2">800</td>
            </tr>
        </tfoot>
    </table>
    
    <br>
    Przydadzą się &nbsp; znaczniki &lt;colgroup&gt; i &lt;col&gt;
    &amp;
    &copy;
    &quot;
    &reg;
    &euro;
    &sect;
    
    
</body>
</html>

<!-- ENCJE, WAZNE!

<           -> lt 
>           -> gt
spacja      -> nbsp
&           -> amp
""          -> quot
copyright   -> copy
registered  -> reg
euro        -> euro
podwojne S  -> sect
-->
